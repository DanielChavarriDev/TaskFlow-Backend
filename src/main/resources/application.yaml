spring:
  application:
    name: taskflow

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/taskflow_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

taskflow:
  jwt:
    secret: ${JWT_SECRET_BASE64}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

  admin:
    provision-enabled: ${TASKFLOW_ADMIN_PROVISION_ENABLED:false}
    email: ${TASKFLOW_ADMIN_EMAIL:}
    password: ${TASKFLOW_ADMIN_PASSWORD:}
    name: ${TASKFLOW_ADMIN_NAME:TaskFlow Administrator}

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:true}
